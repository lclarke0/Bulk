name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --tests 'com.bulkplan.tracker.LogicTest' :app:assembleDebug --stacktrace

      - name: Render screen previews
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --tests 'com.bulkplan.tracker.ScreensTest' --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: app/build/screens/
          if-no-files-found: ignore

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BulkPlan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BulkPlan-apk
          path: BulkPlan.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BulkPlan.apk --prerelease --title "Bulk Plan build ${{ github.run_number }}" --notes "Download BulkPlan.apk on your phone and install it. Built from ${{ github.sha }}."
